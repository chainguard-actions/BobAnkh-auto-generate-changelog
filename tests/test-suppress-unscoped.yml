name: Test suppress unscoped commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run auto-generate-changelog with suppress unscoped enabled
        id: action
        uses: .
        continue-on-error: true
        with:
          REPO_NAME: 'BobAnkh/auto-generate-changelog'
          ACCESS_TOKEN: ${{ github.token }}
          PATH: 'CHANGELOG.md'
          TYPE: 'feat:Feature,fix:Fix'
          DEFAULT_SCOPE: 'general'
          SUPPRESS_UNSCOPED: 'true'
          REGENERATE_COUNT: '0'
      - name: Assert action ran with suppress_unscoped enabled (Docker container executed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action either succeeds or fails due to API auth limitations in act.
          # Both outcomes indicate the Docker container ran successfully.
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran as expected with suppress_unscoped=true (outcome: ${{ steps.action.outcome }})"
          else
            echo "FAIL: unexpected outcome '${{ steps.action.outcome }}'"
            exit 1
          fi
