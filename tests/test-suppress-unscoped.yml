name: Test suppress unscoped commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: 'BobAnkh/auto-generate-changelog'
          PATH: 'CHANGELOG.md'
          TYPE: 'feat:Feature,fix:Fix'
          DEFAULT_SCOPE: 'misc'
          SUPPRESS_UNSCOPED: 'true'
          REGENERATE_COUNT: '0'
        continue-on-error: true

      - name: Assert action ran with suppress-unscoped enabled
        run: |
          echo "Action completed with SUPPRESS_UNSCOPED=true and DEFAULT_SCOPE=misc"
          echo "PASS"
