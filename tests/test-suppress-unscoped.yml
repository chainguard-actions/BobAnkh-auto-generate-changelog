name: Test suppress unscoped commits
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run auto-generate-changelog with suppress-unscoped enabled
        id: action
        uses: .
        with:
          REPO_NAME: 'BobAnkh/auto-generate-changelog'
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATH: 'CHANGELOG.md'
          TYPE: 'feat:Feature,fix:Fix'
          DEFAULT_SCOPE: 'general'
          SUPPRESS_UNSCOPED: 'true'
          REPLACE_EMPTY_RELEASE_INFO: '*No changes*'
        continue-on-error: true
      - name: Assert action completed
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action completed with outcome ${{ steps.action.outcome }}"
          else
            echo "FAIL: unexpected outcome ${{ steps.action.outcome }}"
            exit 1
          fi
